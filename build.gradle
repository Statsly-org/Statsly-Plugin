plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
}

group = 'me.statix'
version = '1.0'

repositories {
    mavenCentral()
    maven {
        name = "spigotmc-repo"
        url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }
    maven {
        name = "viaversion-repo"
        url = "https://repo.viaversion.com"
    }
}

dependencies {
    compileOnly("org.spigotmc:spigot-api:1.21-R0.1-SNAPSHOT")
    compileOnly("com.viaversion:viaversion-api:5.5.0")
}

tasks {
    runServer {
        minecraftVersion("1.21.4")
        downloadPlugins{
            modrinth("viaversion", "5.5.0")
            modrinth("viabackwards", "5.5.0")
            modrinth("luckperms", "v5.5.17-bukkit")
        }
    }
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

// Generate Build ID for security (unique per build)
def generateBuildId() {
    def buildId = UUID.randomUUID().toString().replace("-", "").substring(0, 32)
    return buildId
}

// Create build.properties file with Build ID
task generateBuildProperties {
    doLast {
        def buildId = generateBuildId()
        def buildPropsFile = file("${sourceSets.main.output.resourcesDir}/build.properties")
        buildPropsFile.parentFile.mkdirs()
        buildPropsFile.text = "build.id=${buildId}\nbuild.timestamp=${new Date().getTime()}\n"
        println "Generated Build ID: ${buildId}"
    }
}

// Make sure build.properties is generated before resources are processed
processResources.dependsOn generateBuildProperties
