# Statsly Plugin Configuration
# ============================
# 
# Statsly is a Minecraft server dashboard and analytics platform.
# This plugin connects your Minecraft server to the Statsly Dashboard,
# allowing you to monitor server statistics, player activity, and more.
#
# This file is automatically generated when the server is connected to Statsly Dashboard.
# Do not manually edit the serverUuid value unless you know what you're doing.
#
# ============================

# Server UUID - Unique identifier for this server in the Statsly system
# This UUID is automatically set when you run /statix setup <code> and confirm the connection on the dashboard.
# The UUID is used to identify your server for statistics, analytics, and dashboard features.
#
# ⚠️ WARNING: Do NOT share this UUID with anyone!
# This UUID is unique to your server and should be kept private for security reasons.
serverUuid: ""

